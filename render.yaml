# Render.com blueprint: web API + dashboard behind the Urja portal adapter.
# The portal credentials are sync=false: Render prompts for them on first
# deploy and stores them as encrypted secrets.
services:
  - type: web
    name: urja-meter-ops-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: URJA_USER
        sync: false
      - key: URJA_PASSWORD
        sync: false
      - key: URJA_PORTAL_BASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"
