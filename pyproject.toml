# Vercel deployment config. The [project] dependencies are what the Python
# runtime installs on builds (preferred over requirements.txt when this file
# exists); [tool.vercel] points at the FastAPI ASGI entrypoint.
[project]
name = "urja-meter-ops-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "uvicorn>=0.30",
]

[tool.vercel]
entrypoint = "app.main:app"
